name: Build and Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  MacOS:
    strategy:
      fail-fast: true
      matrix:
        args:
          - image: macos-15
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}
